services:
  custom-mtg-gallery:
    container_name: custom-mtg-gallery
    build: .
#    ports:
#      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SETS_DIR=/app/sets
      - DATA_DIR=/app/data
      - GALLERY_PASSWORD=DigiMTG
    volumes:
      - ./sets:/app/sets:ro
      - ./data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://localhost:3000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    name: ${PROXY_NETWORK:-npm_default}
    external: true
