services:
  custom-mtg-gallery:
    container_name: custom-mtg-gallery
    build: .
#    ports:
#      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SETS_DIR=/app/sets
      - DATA_DIR=/app/data
      - GALLERY_PASSWORD=DigiMTG
    volumes:
      - ./sets:/app/sets:ro
      - ./data:/app/data
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    name: ${PROXY_NETWORK:-npm_default}
    external: true
